name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Compatible-release pin: takes 0.16.x bug fixes, but not 0.17, where
      # new default rules land. An unpinned ruff turns an upstream release into
      # a red build on code nobody touched. Bump the minor deliberately.
      - run: pip install "ruff~=0.16.1"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pyitlib scipy numpy
      - run: pytest -v --ignore=results/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install -e ".[dev]"
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/langquant-wheel"
          "$RUNNER_TEMP/langquant-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/langquant-wheel/bin/python" -c "from langquant import ConversationState, LangQuantSession"
          "$RUNNER_TEMP/langquant-wheel/bin/python" -m langquant --help
          "$RUNNER_TEMP/langquant-wheel/bin/langquant" --help
